[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sru-generator"
version = "1.2.0"
description = "Generic tools for generating Swedish SRU files."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Nikolaos Paximadakis" }
]
keywords = ["sru", "skatteverket", "tax", "sweden"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Nikolaos-Paximadakis/sru-generator"
Repository = "https://github.com/Nikolaos-Paximadakis/sru-generator"
Issues = "https://github.com/Nikolaos-Paximadakis/sru-generator/issues"

[project.scripts]
sru-generator = "sru_generator.cli:main"

[tool.setuptools]
packages = ["sru_generator"]
include-package-data = true

[tool.setuptools.package-data]
sru_generator = ["py.typed"]

[dependency-groups]
dev = [
  "pytest>=6.0",
  "pytest-cov>=2.0",
  "black>=21.0",
  "flake8>=3.8",
  "isort>=5.0",
  "mypy>=0.800",
  "build",
  "twine",
]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
