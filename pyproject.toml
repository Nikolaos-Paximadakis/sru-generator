[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sru-generator"
version = "1.0.1"
description = "Generate Swedish Skatteverket SRU files (INFO.SRU + BLANKETTER.SRU) for the K4 capital-gains form."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Nikos Paximadakis", email = "nikos.paximadakis@gmail.com" }
]
keywords = ["sru", "skatteverket", "k4", "deklaration", "tax", "sweden", "swedish-tax", "capital-gains", "crypto"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Natural Language :: Swedish",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Nikolaos-Paximadakis/sru-generator"
Repository = "https://github.com/Nikolaos-Paximadakis/sru-generator"
Issues = "https://github.com/Nikolaos-Paximadakis/sru-generator/issues"
Changelog = "https://github.com/Nikolaos-Paximadakis/sru-generator/blob/main/CHANGELOG.md"

[project.scripts]
sru-generator = "sru_generator.cli:main"

[tool.setuptools]
packages = ["sru_generator"]
include-package-data = true

[tool.setuptools.package-data]
sru_generator = ["py.typed"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.13",
  "ruff>=0.14",
  "pre-commit>=4.0",
  "twine",
  "hypothesis>=6.100",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined"]
files = ["sru_generator", "tests"]

[tool.pyright]
# Second opinion on the package (stricter about unknown types than mypy). Run with
# `uvx pyright@1.1.414`; CI pins the same version.
include = ["sru_generator"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
# Only "# pyright: ignore[rule]" silences pyright ("# type: ignore" is for mypy), and an
# ignore that no longer suppresses anything is an error.
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
  "E", "F", "I", "B", "UP", "ANN", "S", "RUF", "PL", "DTZ", "PTH", "FBT",
  "SIM", "PERF", "T20", "ERA",
]
ignore = [
  "PLR0913",  # public builders take several keyword-friendly parameters by design
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",     # pytest asserts
  "PLR2004",  # literal expected values
  "SIM117",   # `with self.subTest(...):` around `with self.assertRaises(...):` is the unittest idiom
]
"sru_generator/cli.py" = ["T201"]  # a CLI: print is its output, to stdout and stderr
"examples/**" = ["T201", "ANN", "PLR2004", "S"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
filterwarnings = ["error"]
xfail_strict = true

[tool.coverage.run]
source = ["sru_generator"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
