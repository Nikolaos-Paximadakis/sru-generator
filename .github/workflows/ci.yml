name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --group dev

    - name: Run tests
      run: uv run pytest tests/ -v --cov=sru_generator --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: uv sync --group dev

    - name: Run flake8
      run: uv run flake8 sru_generator/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run black
      run: uv run black --check sru_generator/ tests/

    - name: Run isort
      run: uv run isort --check-only sru_generator/ tests/

    - name: Run mypy
      run: uv run mypy sru_generator/ --ignore-missing-imports

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: uv sync --group dev

    - name: Build package
      run: uv build

    - name: Check package
      run: uv run twine check dist/*
